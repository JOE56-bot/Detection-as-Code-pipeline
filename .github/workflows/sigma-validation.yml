name: Detection-as-Code Validation

on:
  push:
    branches:
      - main
      - 'test/**'
    paths:
      - 'detections/sigma/**'
      - 'detections/kql/**'
      - 'tests/kql/**'
      - '.github/workflows/sigma-validation.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'detections/sigma/**'
      - 'detections/kql/**'
      - 'tests/kql/**'
      - '.github/workflows/sigma-validation.yml'

jobs:
  validate-sigma:
    name: Validate Sigma Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sigma CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli

      - name: Validate Sigma rules
        run: |
          sigma check --fail-on-issues detections/sigma/

  test-kql:
    name: Test KQL Detection Logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run KQL matching logic tests
        run: |
          python -m unittest discover -s tests/kql -p "test_*.py" -v
